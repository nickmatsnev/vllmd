[project]
name = "vllmd"
version = "0.1.0"
description = "Lightweight distributed orchestration for vLLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
worker = [
    "vllm",
]

[project.scripts]
vllmd = "vllmd.main:main"
